name: gate
on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * *"   # nightly: pixi update within the pins first, so an upstream patch release shows up the day it lands
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
      - if: github.event_name == 'schedule'
        run: pixi update
      - run: pixi run gate     # unit tests, tool builds, expat differential (2 seeds), negative control
      - run: pixi run build    # precompiled package
