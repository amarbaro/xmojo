# rattler-build recipe, modular-community shape. Build locally: pixi run package (needs
# rattler-build); the tests import the installed xmojo.mojoc, not the source tree.
context:
  version: 0.1.0

package:
  name: "xmojo"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile -I ${{ PREFIX }}/lib/mojo src/xmojo -o ${{ PREFIX }}/lib/mojo/xmojo.mojoc

requirements:
  host:
    - mojo-compiler =1.1.0
    - emberserde ==0.1.0
  build:
    - mojo-compiler =1.1.0
  run:
    - ${{ pin_compatible('mojo-compiler') }}
    - emberserde ==0.1.0

tests:
  - script:
    - if: unix
      then:
        - for f in tests/test_*.mojo; do mojo run -I tests "$f" || exit 1; done
    files:
      source:
        - tests/
    requirements:
      run:
        - mojo =1.1.0

about:
  homepage: https://github.com/amarbaro/xmojo
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  summary: XML for Mojo, parse into structs, stream records, write back, checked against expat
  repository: https://github.com/amarbaro/xmojo

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - xmojo
